<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alle innlegg – Lære med KI</title>
  <script>try{if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/analytics.js"></script>
  <script id="i18n-dict" type="application/json">
  {
    "nav-undervisningsaktiviteter": {"no": "Undervisningsaktiviteter", "en": "Teaching activities"},
    "nav-alle-innlegg": {"no": "Alle innlegg", "en": "All posts"},
    "nav-om-meg": {"no": "Om meg", "en": "About"},
    "nav-instrukser": {"no": "Instrukser", "en": "Prompts"},
    "nav-blogg": {"no": "Blogg", "en": "Blog"},
    "nav-andre-ressurser": {"no": "Andre ressurser", "en": "Other resources"},
    "nav-toggle-aria": {"no": "Åpne meny", "en": "Open menu"},
    "page-heading": {"no": "Alle innlegg", "en": "All posts"},
    "page-lead": {"no": "Her finner du en oversikt over alle innlegg publisert på denne bloggen.", "en": "An overview of every post published on this blog."},
    "search-placeholder": {"no": "Søk i innlegg …", "en": "Search posts …"},
    "filter-label": {"no": "Kategori", "en": "Category"},
    "filter-sub-label": {"no": "Underkategori", "en": "Subcategory"},
    "filter-all": {"no": "Alle kategorier", "en": "All categories"},
    "sort-label": {"no": "Sortering", "en": "Sort"},
    "sort-kronologisk": {"no": "Nyeste først", "en": "Newest first"},
    "sort-alfabetisk": {"no": "Alfabetisk", "en": "Alphabetical"},
    "empty-state": {"no": "Ingen innlegg i denne kategorien ennå.", "en": "No posts in this category yet."},
    "load-more-btn": {"no": "Vis flere", "en": "Show more"},
    "footer-copyright": {"no": "Opphavsrett 2026 – Lære med KI", "en": "Copyright 2026 – Lære med KI"},
    "footer-personvern": {"no": "Personvernerklæring", "en": "Privacy policy"},
    "footer-kontakt": {"no": "Kontakt", "en": "Contact"},
    "theme-toggle-aria": {"no": "Bytt fargetema", "en": "Toggle color theme"}
  }
  </script>
</head>
<body>

  <div id="site-header"></div>

  <section class="section" style="padding-bottom:0">
    <div class="wide">
      <div class="section-lead">
        <h1 data-i18n="page-heading">Alle innlegg</h1>
        <p data-i18n="page-lead">Her finner du en oversikt over alle innlegg publisert på denne bloggen.</p>
      </div>
      <input type="search" class="search-input" data-posts-search data-i18n-attr="placeholder:search-placeholder" placeholder="Søk i innlegg …" aria-label="Søk i innlegg">
      <p class="filter-group-label" data-i18n="filter-label">Kategori</p>
      <div class="filter-box"><div class="filter-bar filter-bar--row" data-posts-filters></div></div>
      <p class="filter-group-label" data-i18n="filter-sub-label" data-posts-sublabel hidden>Underkategori</p>
      <div class="filter-box" data-posts-subfilter-box hidden><div class="filter-bar filter-bar--row" data-posts-subfilters></div></div>
      <p class="filter-group-label" data-i18n="sort-label">Sortering</p>
      <div class="filter-box"><div class="filter-bar filter-bar--row" data-posts-sort></div></div>
    </div>
  </section>

  <section class="posts-section">
    <div class="wide">
      <div class="posts-grid" data-posts-grid></div>
      <div class="load-more" data-load-more></div>
    </div>
  </section>

  <script src="/js/partials.js" defer></script>
  <script src="/js/nav.js" defer></script>
  <script src="/js/theme.js" defer></script>
  <script src="/js/i18n.js" defer></script>
  <script src="/js/posts.js" defer></script>

  <div id="site-footer"></div>

</body>
</html>
